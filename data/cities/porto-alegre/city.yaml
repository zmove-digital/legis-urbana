      basis: *id029
      check:
        type: gte
        field: proposed_setback_front
    setback_side_pct:
      label: Afastamento lateral minimo (% da altura da edificacao)
      value: 18
      unit: '%'
      basis: *id029
      check:
        type: setback_from_height
        field: proposed_setback_side
        height_field: building_height
        applies_above: 12.5
    setback_back_pct:
      label: Afastamento de fundo minimo (% da altura da edificacao)
      value: 18
      unit: '%'
      basis: *id029
      check:
        type: setback_from_height
        field: proposed_setback_back
        height_field: building_height
        applies_above: 12.5
    min_permeable_pct:
      label: Taxa de Permeabilidade minima
      value: 10
      unit: '%'
      basis: *id029
      check:
        type: min_area_piecewise
        field: permeable_area
        base: lot_area
        segments:
        - up_to: 1500
          pct: 10
        - pct: 20
      notes:
      - Para terrenos com area superior a 1.500 m2, aplica-se 10% sobre os primeiros 1.500 m2 e 20% sobre
        a area que exceder esse valor (nota de rodape do Anexo Anexo 2.8.3, fl. 2).
    tp_factor_conversion:
      label: Fator de conversao da Taxa de Permeabilidade
      value: 50
      unit: '%'
