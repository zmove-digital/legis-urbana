      - 75 m2 quando se tratar de Demanda Habitacional Prioritaria (nota de rodape).
    lot_min_frontage:
      label: Testada minima do lote
      value: 5
      unit: m
      basis: *id029
  group: ZOT 8.3 - Eixos Estrategicos
