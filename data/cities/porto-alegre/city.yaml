  kind: lei
  number: '1.075'
  year: 2026
  title: Lei Complementar nº 1.075/2026 - Plano Diretor Urbano Sustentavel de Porto Alegre
  url: https://legislacao.portoalegre.rs.gov.br/norma/51485
  retrieved_at: '2026-10-21'
  notes: Fonte de referencia do macrozoneamento e das finalidades das ZOTs (art. 4 da LC 1076/2026). Nao
