rules:
- code: tp-dispensa-lote-ate-150m2
  title: Dispensa da taxa de permeabilidade em lote de ate 150 m2
  message: 'Taxa de permeabilidade dispensada: terreno com matricula individual de area igual ou inferior
    a 150 m2 (art. 79, III).'
  severity: info
  when:
    lot_area:
      lte: 150
  effects:
  - type: override_param
    param: min_permeable_pct
    value: 0
    message: Taxa de permeabilidade dispensada (art. 79, III da LC 1076/2026).
    basis:
      source: luos
      ref: Art. 79, III
  basis:
    source: luos
    ref: Art. 79, III
- code: tp-dispensa-centro-historico
  title: Dispensa da taxa de permeabilidade no Centro Historico
  message: Taxa de permeabilidade dispensada para terrenos localizados no Centro Historico (art. 79, IV).
  severity: info
  when:
    centro_historico:
      eq: true
  effects:
  - type: override_param
    param: min_permeable_pct
    value: 0
    message: Taxa de permeabilidade dispensada (art. 79, IV da LC 1076/2026).
    basis:
      source: luos
      ref: Art. 79, IV
  basis:
    source: luos
    ref: Art. 79, IV
- code: tp-dispensa-atividade-incompativel
  title: Dispensa da taxa de permeabilidade por atividade incompativel
  message: Taxa de permeabilidade dispensada para edificacoes destinadas a atividades incompativeis com
    areas permeaveis (art. 79, II).
  severity: info
  when:
    atividade_incompativel:
      eq: true
  effects:
  - type: override_param
    param: min_permeable_pct
    value: 0
    message: Taxa de permeabilidade dispensada (art. 79, II da LC 1076/2026).
    basis:
      source: luos
      ref: Art. 79, II
  basis:
    source: luos
    ref: Art. 79, II
- code: tp-dispensa-ampliacao-area-edificada
  title: Dispensa da taxa de permeabilidade em aumento sobre area edificada
  message: Taxa de permeabilidade dispensada para aumento, reforma ou reciclagem de uso sobre area ja
    edificada (art. 79, I).
  severity: info
  when:
    ampliacao_area_edificada:
      eq: true
  effects:
  - type: override_param
    param: min_permeable_pct
    value: 0
    message: Taxa de permeabilidade dispensada (art. 79, I da LC 1076/2026).
    basis:
      source: luos
      ref: Art. 79, I
  basis:
    source: luos
    ref: Art. 79, I
- code: zot14-his-regime-zot1
  title: Regime urbanistico da ZOT 1 para HIS na ZOT 14
  message: Adotavel o regime urbanistico da ZOT 1 na ZOT 14 para empreendimento destinado a Habitacao
    de Interesse Social (art. 19, paragrafo 2).
  severity: attention
  when:
    his:
      eq: true
  applies_to_zones:
  - ZOT 14
  effects:
  - type: override_param
    param: ca_base
    value: 1.5
    message: Coeficiente de aproveitamento basico da ZOT 1 (1,5) por conta do regime de HIS na ZOT 14
      (art. 19, paragrafo 2).
    basis:
      source: luos
      ref: Art. 19, paragrafo 2
  - type: override_param
    param: ca_max
    value: 2.5
    message: Coeficiente de aproveitamento maximo da ZOT 1 (2,5) por conta do regime de HIS na ZOT 14
      (art. 19, paragrafo 2).
    basis:
      source: luos
      ref: Art. 19, paragrafo 2
  - type: add_requirement
    title: Verificar os demais parametros conforme a ZOT 1
    message: 'O regime de HIS adota o regime urbanistico da ZOT 1: altura maxima de 9 m, recuo de jardim
      de 4 m, afastamentos laterais e de fundos isentos e taxa de permeabilidade de 30% (lotes de ate
      1.500 m2) e 40% (area excedente). Alem disso, o imovel deve apresentar bens ambientais a preservar
      em percentual minimo de 10% acima do previsto na legislacao especifica (art. 19, paragrafo 3).'
    severity: attention
    basis:
      source: luos
      ref: Art. 19, paragrafos 2 e 3
  basis:
    source: luos
    ref: Art. 19, paragrafos 2 e 3
- code: zot82-regime-especial-4d
  title: Regime Especial +4D na ZOT 8.2
  message: 'Regime Especial +4D: coeficiente de aproveitamento basico 7,5 e maximo 13, mediante atendimento
    dos criterios e pontuacao minima do Anexo 2.8.2, fl. 3 (art. 74).'
  severity: attention
  when:
    regime_4d:
      eq: true
  applies_to_zones:
  - ZOT 8.2A
  effects:
  - type: override_param
    param: ca_base
    value: 7.5
    message: Coeficiente de aproveitamento basico 7,5 no Regime Especial +4D (Anexo 2.8.2, nota 3).
    basis:
      source: luos_anexo2
      ref: Anexo 2.8.2, nota 3
  - type: override_param
    param: ca_max
    value: 13
    message: Coeficiente de aproveitamento maximo 13 no Regime Especial +4D (Anexo 2.8.2, nota 4).
    basis:
      source: luos_anexo2
      ref: Anexo 2.8.2, nota 4
  - type: add_requirement
    title: Anexar a pontuacao minima do Anexo 2.8.2
    message: O Regime Especial +4D exige a pontuacao minima por faixa de area definida no Anexo 2.8.2,
      fl. 3 (somatorio minimo de 15 pontos para terrenos de ate 200 m2, 20 pontos ate 500 m2, 30 pontos
      ate 1.000 m2, 35 pontos ate 2.000 m2, 40 pontos ate 3.000 m2, 50 pontos ate 5.000 m2, 60 pontos
      ate 10.000 m2, 80 pontos ate 30.000 m2 e 100 pontos acima de 30.000 m2). Para fins de determinacao
      da area, exclui-se as areas isentas.
    severity: attention
    basis:
      source: luos_anexo2
      ref: Anexo 2.8.2, fl. 3
  basis:
    source: luos
    ref: Art. 74
- code: trazado-plano-diretor
  title: Imovel atingido pelo trazado do Plano Diretor
  message: 'Imovel atingido pelo trazado do Plano Diretor: o coeficiente de aproveitamento e a taxa de
    permeabilidade sao calculados sobre a area remanescente do terreno, ou sobre a totalidade mediante
    Transferencia do Direito de Construir (art. 26, I). Quando a ocupacao parcial ou total for inviabilizada
    pelo trazado, a altura maxima fica limitada a 9 m (art. 26, II, b).'
  severity: attention
  when:
    trazado_plano_diretor:
      eq: true
  effects:
  - type: add_requirement
    title: Conferir a base de calculo do coeficiente e da TP
    message: Conferir a area remanescente e a eventual Transferencia do Direito de Construir antes de|Considerar
      os limites de coeficiente de aproveitamento e de taxa de permeabilidade.
    severity: attention
    basis:
      source: luos
      ref: Art. 26
  basis:
    source: luos
    ref: Art. 26
- code: imovel-em-multiplas-zots
  title: Imovel inserido em mais de uma ZOT
  message: 'Imovel inserido em mais de uma ZOT: o regime urbanistico e determinado proporcionalmente a
    area correspondente a cada ZOT, podendo ser adotados os padroes de regime de atividades e altura da
    ZOT menos restritiva, exceto quando envolver a ZOT 15 ou a ZOT 16 (art. 24, paragrafo 3).'
  severity: attention
  when:
    imovel_multiplas_zots:
      eq: true
  effects:
  - type: add_requirement
    title: Verificar a incidencia em mais de uma ZOT
    message: Se o imovel estiver inserido em mais de uma ZOT, o regime e determinado proporcionalmente,
      conforme o art. 24, paragrafo 3.
    severity: attention
    basis:
      source: luos
      ref: Art. 24, paragrafo 3
  basis:
    source: luos
    ref: Art. 24, paragrafo 3
- code: altura-acrescimo-rooftop
  title: Acrescimo de altura para rooftop
  message: A altura maxima pode ser acrescida de ate 4 m para areas de lazer, convilio ou paisagismo em
    cobertura (rooftops), desde que a area construida do rooftop nao ultrapasse 40% da area do pavimento
    imediatamente inferior e haja area vegetada minima de 25% (art. 81, paragrafo 2, I).
  severity: info
  when:
    rooftop:
      eq: true
  effects:
  - type: add_requirement
    title: Verificar os requisitos do rooftop
    message: Conferir os requisitos do art. 81, paragrafo 2, I antes de usar o acrescimo de 4 m na altura
      maxima.
    severity: attention
    basis:
      source: luos
      ref: Art. 81, paragrafo 2, I
  basis:
    source: luos
    ref: Art. 81, paragrafo 2, I
- code: altura-acrescimo-bem-tombado
  title: Acrescimo de altura para preservacao de bem tombado
  message: A altura maxima pode ser acrescida de ate 9 m em projetos que promovam a preservacao de bem
    tombado ou inventariado como de estruturao no proprio terreno, desde que nao situados nas ZOTs 1 e
    2 (art. 81, paragrafo 2, II).
  severity: info
  when:
    bem_tombado:
      eq: true
  effects:
  - type: add_requirement
    title: Verificar o acrescimo de altura
    message: 'Conferir o art. 81, paragrafo 2, II: acrescimo de ate 9 m para preservacao de bem tombado
      ou inventariado no proprio terreno, vedado nas ZOTs 1 e 2.'
    severity: attention
    basis:
      source: luos
      ref: Art. 81, paragrafo 2, II
  basis:
    source: luos
    ref: Art. 81, paragrafo 2, II
- code: isenca-fachada-ativa
  title: Isenca de contabilizacao por fachada ativa
  message: 'E isenta de contabilizacao no calculo do potencial construtivo a area do pavimento configurado
    como fachada ativa, nos termos do art. 73, V e paragrafos 1 e 2 da LC 1076/2026: no minimo 50% da
    extensao da fachada voltada ao espaco publico composta por portas, janelas ou elementos transparentes,
    com no maximo um pavimento isento.'
  severity: info
  when:
    area_isenta_ca:
      gt: 0
  effects:
  - type: add_requirement
    title: Conferir a fachada ativa
    message: A area isenta deve ser informada no campo 'area construida isenta de contabilizacao no coeficiente
      de aproveitamento'.
    severity: info
    basis:
      source: luos
      ref: Art. 73, V
  basis:
    source: luos
    ref: Art. 73, V
