- key: luos_anexo2
  kind: anexo
  number: '2'
  year: 2026
  title: Lei Complementar nº 1.076/2026 - Anexo 2 (quadros de regime urbanistico por ZOT)
  url: https://legislacao.portoalegre.rs.gov.br/media/sapl/public/anexonormajuridica/2026/1420/lc1076a.pdf
  consolidated_as_of: '2026-07-14'
