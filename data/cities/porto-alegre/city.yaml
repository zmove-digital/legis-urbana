slug: porto-alegre
name: Porto Alegre
uf: RS
ibge: '4314902'
is_demo: false
description: Porto Alegre - Lei Complementar nº 1.076/2026 (LUOS) e Lei Complementar nº 1.075/2026 (Plano
  Diretor Urbano Sustentavel). O regime urbanistico de cada Zona de Ordenamento Territorial (ZOT) esta
  no Anexo 2 da LC 1076/2026, que establish coeficiente de aproveitamento basico e maximo, altura maxima,
  recuo de jardim, afastamentos laterais e de fundos (18% da altura acima de 12,50 m), taxa de permeabilidade
  e fator de conversao.
zone_selection:
  method: manual
  hint: A ZOT e o eventual sub-setor sao identificados no mapa oficial de zoneamento (Anexo 1 da LC 1076/2026,
    fl. 1), constante do anexo da lei no link indicado abaixo. As ZOTs 8.1, 8.2 e 8.3 tem sub-setores
    identificados por letra no desenho do Anexo 2 correspondente.
  helper_url: https://legislacao.portoalegre.rs.gov.br/media/sapl/public/anexonormajuridica/2026/1420/lc1076a.pdf
sources:
