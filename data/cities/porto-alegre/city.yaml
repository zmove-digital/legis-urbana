questions:
- key: lot_area
  label: Area do lote
  type: number
  required: true
  unit: m2
  help: Area do terreno considerada para o regime urbanistico (art. 24 da LC 1076/2026).
- key: footprint_area
  label: Area de implantacao (por pavimento terreo)
  type: number
  unit: m2
  help: Area ocupada pela edificacao no pavimento terreo.
- key: total_built_area
  label: Area total construida
  type: number
  required: true
  unit: m2
  help: Somatoria da area construida de todos os pavimentos.
- key: area_isenta_ca
  label: Area construida isenta de contabilizacao no coeficiente de aproveitamento
  type: number
  unit: m2
  help: Soma das areas isentas do art. 73 da LC 1076/2026 (garagem e circulacoes, residencia unifamiliar
    com ate 2 unidades, area economica vinculada a habitacao unifamiliar, areas de imoveis tombados, fachada
    ativa, galerias de uso publico, unidades de triagem de residuos, construcoes auxiliares no recuo de
    jardim e balanco, beirais, floreiras e abas).
- key: use
  label: Uso pretendido
  type: select
  required: true
  options:
  - residencial
  - comercial
  - misto
  - servicos
  - industrial
  - institucional
- key: floors
  label: Numero de pavimentos
  type: number
  unit: pavimentos
- key: floor_height
  label: Pe-direito medio
  type: number
  unit: m
  default: 3.0
  help: Usado para estimar a altura da edificacao quando nao informada a altura.
- key: building_height
  label: Altura da edificacao (acima da Referencia de Nivel)
  type: derived
  unit: m
  derivations:
  - fact: building_height
    op: mul
    args:
    - floors
    - floor_height
  help: Informada pelo responsavel tecnico. Se deixada em branco, e calculada pelo numero de pavimentos
    vezes o pe-direito medio.
- key: proposed_setback_front
  label: Recuo frontal proposto (recuo de jardim)
  type: number
  unit: m
- key: proposed_setback_side
  label: Afastamento lateral proposto
  type: number
  unit: m
- key: proposed_setback_back
  label: Afastamento de fundo proposto
  type: number
  unit: m
- key: permeable_area
  label: Area permeavel proposta
  type: number
  unit: m2
  help: Area que permanece livre de pavimentacao ou construcao (art. 75, I). Nao computam as areas construidas
    do art. 73, inc. IX, marquises e acessos cobertos (art. 76, paragrafo 2).
- key: via_arterial
  label: A testada do lote esta em via estruturante ou arterial?
  type: boolean
  help: Define o recuo de jardim nas ZOTs 14, 15 e 16 (4 m ou 12 m).
- key: terreno_origem_parcelamento
  label: O terreno tem origem em parcelamento do solo aprovado pelo Municipio?
  type: boolean
  help: Condiciona a reducao de 50% do coeficiente de aproveitamento (art. 24, paragrafo 4, III).
- key: parcelamento_equipamentos
  label: O parcelamento de origem destinou areas para equipamentos comunitarios?
  type: boolean
  help: Quando verdadeiro, o coeficiente de aproveitamento pode incidir sobre a area total do terreno,
    e nao sobre o Modulo de Fracionamento (art. 24, paragrafo 4, II).
- key: his
  label: O empreendimento e Habitacao de Interesse Social (HIS)?
  type: boolean
  help: Na ZOT 14, o regime da ZOT 1 pode ser adotado para HIS (art. 19, paragrafo 2).
- key: regime_4d
  label: Adota o Regime Especial +4D (ZOT 8.2 - Floresta / Sao Geraldo)?
  type: boolean
  help: Habilita o coeficiente de aproveitamento basico 7,5 e maximo 13, mediante a pontuacao minima do
    Anexo 2.8.2, fl. 3 (art. 74).
- key: centro_historico
  label: O terreno esta localizado no Centro Historico?
  type: boolean
  help: A taxa de permeabilidade e dispensada nos terrenos do Centro Historico (art. 79, IV).
- key: atividade_incompativel
  label: A atividade pretendida e incompativel com areas permeaveis?
  type: boolean
  help: Posto de combustiveis, unidades industriais, centro de logistica e distribuicao, unidades de triagem
    e destinacao final de residuos solidos (art. 79, II).
- key: ampliacao_area_edificada
  label: Aumento, reforma ou reciclagem de uso incide sobre area ja edificada?
  type: boolean
  help: Condiciona a dispensas da taxa de permeabilidade (art. 79, I).
- key: trazado_plano_diretor
  label: O imovel esta atingido pelo trazado do Plano Diretor?
  type: boolean
  help: Define a base de calculo do coeficiente de aproveitamento e da TP (art. 26).
- key: imovel_multiplas_zots
  label: O imovel esta inserido em mais de uma ZOT?
  type: boolean
  help: O regime urbanistico passa a ser determinado proporcionalmente a area correspondente a cada ZOT
    (art. 24, paragrafo 3), exceto quando envolver a ZOT 15 ou a ZOT 16.
- key: rooftop
  label: O projeto preve area de lazer em cobertura (rooftop)?
  type: boolean
  help: Permite acrescimo de ate 4 m na altura maxima (art. 81, paragrafo 2, I).
- key: bem_tombado
  label: O projeto promove a preservacao de bem tombado ou inventariado no proprio terreno?
  type: boolean
  help: Permite acrescimo de ate 9 m na altura maxima, fora das ZOTs 1 e 2 (art. 81, paragrafo 2, II).
zones:
- code: ZOT 1
  name: Predominancia residencial de baixa transformacao
  description: Regime urbanistico da ZOT 1 conforme art. 6 e Anexo 2 da LC 1076/2026.
  params:
    ca_base:
      label: Coeficiente de Aproveitamento basico
      value: null
      basis:
        source: luos
        ref: Art. 72, I
      notes:
      - O coeficiente de aproveitamento basico define o potencial construtivo permitido sem contrapartida
        (art. 72, I da LC 1076/2026).
      - Valor do coeficiente basico conforme o Anexo 2.1.
      - 'O art. 24, paragrafo 4, III reduz em 50% ''o coeficiente de aproveitamento'' no terreno com area
        de ate 22.500 m2, sem origem em parcelamento do solo aprovado pelo Municipio, localizado nas ZOTs
        1 e 2. O texto nao distingue entre o coeficiente basico e o maximo: a reducao foi aplicada a ambos,
        para que o basico nao supere o maximo. Confirmar o tratamento com o orgao competente.'
      alternatives:
      - when:
          use:
            eq: residencial
          lot_area:
            lte: 22500
          terreno_origem_parcelamento:
            eq: false
        value: 0.75
        message: 'Coeficiente reduzido em 50%: terreno com area de ate 22.500 m2 sem origem em parcelamento
          do solo aprovado pelo Municipio (art. 24, paragrafo 4, III).'
        basis: &id001
          source: luos
          ref: art. 6
      - when:
          use:
            eq: residencial
          lot_area:
            lte: 22500
          terreno_origem_parcelamento:
            eq: true
        message: 'Coeficiente de aproveitamento integral (art. 24, paragrafo 4): o terreno tem origem
          em parcelamento do solo aprovado pelo Municipio.'
        value: 1.5
        basis: *id001
      - when:
          use:
            eq: residencial
          lot_area:
            gt: 22500
        message: Coeficiente de aproveitamento integral (art. 24, paragrafo 4).
        value: 1.5
        basis: *id001
      - when:
          use:
            ne: residencial
        message: 'Coeficiente de aproveitamento integral: para atividades de uso nao residencial o coeficiente
          incide sobre toda a area do terreno (art. 24, paragrafo 5).'
        value: 1.5
        basis: *id001
    ca_max:
      label: Coeficiente de Aproveitamento maximo
      value: null
      basis: &id002
        source: luos_anexo2
        ref: Anexo 2.1
      alternatives:
      - when:
          use:
            eq: residencial
          lot_area:
            lte: 22500
          terreno_origem_parcelamento:
            eq: false
        value: 1.25
        message: 'Coeficiente reduzido em 50%: terreno com area de ate 22.500 m2 sem origem em parcelamento
          do solo aprovado pelo Municipio (art. 24, paragrafo 4, III).'
        basis: *id001
      - when:
          use:
            eq: residencial
          lot_area:
            lte: 22500
          terreno_origem_parcelamento:
            eq: true
        message: 'Coeficiente de aproveitamento integral (art. 24, paragrafo 4): o terreno tem origem
          em parcelamento do solo aprovado pelo Municipio.'
        value: 2.5
        basis: *id001
      - when:
          use:
            eq: residencial
          lot_area:
            gt: 22500
        message: Coeficiente de aproveitamento integral (art. 24, paragrafo 4).
        value: 2.5
        basis: *id001
      - when:
          use:
            ne: residencial
        message: 'Coeficiente de aproveitamento integral: para atividades de uso nao residencial o coeficiente
          incide sobre toda a area do terreno (art. 24, paragrafo 5).'
        value: 2.5
        basis: *id001
      notes:
      - 'O art. 24, paragrafo 4, III reduz em 50% ''o coeficiente de aproveitamento'' no terreno com area
        de ate 22.500 m2, sem origem em parcelamento do solo aprovado pelo Municipio, localizado nas ZOTs
        1 e 2. O texto nao distingue entre o coeficiente basico e o maximo: a reducao foi aplicada a ambos,
        para que o basico nao supere o maximo. Confirmar o tratamento com o orgao competente.'
      check:
        type: ratio_max
        numerator: total_built_area
        denominator: lot_area
        numerator_offset: area_isenta_ca
        denominator_cap: 3000
        denominator_cap_when:
          use:
            eq: residencial
        denominator_cap_exempt_when:
          parcelamento_equipamentos:
            eq: true
    max_height:
      label: Altura maxima da edificacao
      value: 9
      unit: m
      basis: *id002
      check:
        type: lte
        field: building_height
    setback_front:
      label: Recuo de jardim (afastamento frontal minimo)
      value: 4
      unit: m
      basis: *id002
      check:
        type: gte
        field: proposed_setback_front
    setback_side_pct:
      label: Afastamento lateral minimo (% da altura da edificacao)
      value: null
      unit: '%'
      basis: *id002
      notes:
      - AFASTAMENTO LATERAL ISENTO no Anexo 2.1.
    setback_back_pct:
      label: Afastamento de fundo minimo (% da altura da edificacao)
      value: null
      unit: '%'
      basis: *id002
      notes:
      - AFASTAMENTO DE FUNDOS ISENTO no Anexo 2.1.
    min_permeable_pct:
      label: Taxa de Permeabilidade minima
      value: 30
      unit: '%'
      basis: *id002
      check:
        type: min_area_piecewise
        field: permeable_area
        base: lot_area
        segments:
        - up_to: 1500
          pct: 30
        - pct: 40
      notes:
      - Para terrenos com area superior a 1.500 m2, aplica-se 30% sobre os primeiros 1.500 m2 e 40% sobre
        a area que exceder esse valor (nota de rodape do Anexo Anexo 2.1).
    tp_factor_conversion:
      label: Fator de conversao da Taxa de Permeabilidade
      value: 30
      unit: '%'
      basis: *id002
      notes:
      - Percentual maximo da Taxa de Permeabilidade que pode ser convertido em medidas alternativas (nota
        de rodape do Anexo).
    lot_min_area:
      label: Area minima do lote
      value: 150
      unit: m2
      basis: *id002
      notes:
      - 75 m2 quando se tratar de Demanda Habitacional Prioritaria (nota de rodape).
    lot_min_frontage:
      label: Testada minima do lote
      value: 5
      unit: m
      basis: *id002
