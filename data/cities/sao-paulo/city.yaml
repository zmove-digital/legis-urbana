# ---------------------------------------------------------------------------
# Regras condicionais (o "questionário" que o engenheiro responde)
# ---------------------------------------------------------------------------
rules:
  - code: dispensa-recuos-laterais-fundo-altura
    title: "Dispensa de recuos laterais e de fundo por altura da edificação"
    message: "Recuos laterais e de fundo dispensados (art. 66, I)."
    severity: info
    when: {building_height: {lte: 10}}
    exclude_zones: [ZDE-2, ZPI-1, ZPI-2, AC-1, AC-2]
    effects:
      - type: override_param
        param: setback_side_back
        value: 0
        message: "Dispensado: edificação com altura igual ou inferior a 10,00 m (art. 66, I da Lei nº 16.402/2016)."
    basis: {source: luos, ref: "Art. 66, I"}

  - code: dispensa-recuos-laterais-fundo-vizinho
    title: "Dispensa de recuos laterais e de fundo por edificação vizinha encostada"
    message: "Recuos laterais e de fundo dispensados mediante análise caso a caso (art. 66, II)."
    severity: attention
    when: {neighbor_attached: true}
    exclude_zones: [ZDE-2, ZPI-1, ZPI-2, AC-1, AC-2]
    effects:
      - type: override_param
        param: setback_side_back
        value: 0
        message: "Dispensado mediante análise caso a caso pelo órgão técnico competente (art. 66, II)."
    basis: {source: luos, ref: "Art. 66, II"}

  - code: dispensa-recuos-laterais-fundo-testada
    title: "Dispensa de recuos laterais e de fundo por testada igual ou inferior a 10 m"
    message: "Recuos laterais e de fundo dispensados (art. 66, III)."
    severity: info
    when: {lot_front: {lte: 10}}
    exclude_zones: [ZDE-2, ZPI-1, ZPI-2, AC-1, AC-2]
    effects:
      - type: override_param
        param: setback_side_back
        value: 0
        message: "Dispensado: terreno com frente igual ou inferior a 10,00 m (art. 66, III)."
    basis: {source: luos, ref: "Art. 66, III"}

  - code: dispensa-recuo-frontal-passeio
    title: "Recuo frontal dispensado por passeio público com 5,00 m"
    message: "Recuo frontal dispensado (art. 67, § 1º)."
    severity: info
    when: {sidewalk_width: {gte: 5}}
    effects:
      - type: override_param
        param: setback_front
        value: 0
        message: "Dispensado: passeio público já com largura de 5,00 m ou com doação da faixa necessária (art. 67, § 1º)."
    basis: {source: luos, ref: "Art. 67, § 1º"}

  - code: dispensa-recuo-frontal-face-quadra
    title: "Recuo frontal não exigido por ocupação da face de quadra"
    message: "Recuo frontal não exigido (art. 69)."
    severity: info
    when: {block_face_occupied_pct: {gte: 50}}
    effects:
      - type: override_param
        param: setback_front
        value: 0
        message: "Não exigido: no mínimo 50% da face de quadra ocupada por edificações no alinhamento (art. 69)."
    basis: {source: luos, ref: "Art. 69"}

  - code: passeio-publico-minimo
    title: "Largura mínima do passeio público"
    message: "Passeio público com largura inferior a 5,00 m: alargamento obrigatório nas zonas de que trata o art. 67."
    severity: attention
    applies_to_zones: [ZEU, ZEUa, ZEUP, ZEUPa, ZEM, ZEMP, ZC, ZCa, ZM, ZEIS-1, ZEIS-2, ZEIS-3, ZEIS-4, ZEIS-5]
    when: {sidewalk_width: {lt: 5}}
    effects:
      - type: warning
        title: "Alargamento do passeio público"
        message: "Nas zonas previstas no art. 67, I, da Lei nº 16.402/2016 o alargamento do passeio público é obrigatório (passeio mínimo de 5,00 m)."
        severity: attention
    basis: {source: luos, ref: "Art. 67, caput e I"}

  - code: passeio-publico-facultativo-zc
    title: "Alargamento do passeio público facultativo em ZC e ZCa"
    message: "Alargamento facultativo para lotes com até 2.500,00 m² (art. 67, II)."
    severity: info
    applies_to_zones: [ZC, ZCa]
    when: {sidewalk_width: {lt: 5}, lot_area: {lte: 2500}}
    effects:
      - type: warning
        title: "Alargamento do passeio público (facultativo)"
        message: "Em ZC e ZCa, para lotes com área igual ou inferior a 2.500,00 m², o alargamento do passeio público é facultativo (art. 67, II)."
        severity: info
    basis: {source: luos, ref: "Art. 67, II"}

  - code: quota-ambiental-obrigatoria
    title: "Quota Ambiental (QA) — avaliação obrigatória"
    message: "Lote com área superior a 500,00 m²: exigir pontuação mínima de QA (art. 76)."
    severity: attention
    when: {lot_area: {gt: 500}}
    effects:
      - type: warning
        title: "Quota Ambiental (QA)"
        message: "Para edificações novas ou reformas com alteração de área construída superior a 20%, é exigida pontuação mínima de QA (arts. 74 a 76 e Quadros 3A e 3B). O Executivo disponibiliza planilha de cálculo da QA."
        severity: attention
    basis: {source: luos, ref: "Arts. 74 a 76 e Quadros 3A e 3B"}

  - code: quota-ambiental-isenca
    title: "Isenção de Quota Ambiental"
    message: "Lote com até 500,00 m²: isento da aplicação da QA (art. 76, § 2º)."
    severity: info
    when: {lot_area: {lte: 500}}
    effects:
      - type: warning
        title: "Isenção de QA"
        message: "Os lotes com área total igual ou inferior a 500,00 m² estão isentos da aplicação da QA (art. 76, § 2º), ressalvados os lotes originários de desmembramento ou desdobro cujo lote original tenha área superior à mínima exigida."
        severity: info
    basis: {source: luos, ref: "Art. 76, § 2º"}

  - code: permeabilidade-minima
    title: "Taxa de permeabilidade mínima"
    message: "Atender a taxa de permeabilidade mínima do Perímetro de Qualificação Ambiental (art. 81 e Quadro 3A)."
    severity: attention
    effects:
      - type: warning
        title: "Permeabilidade mínima (Quadro 3A)"
        message: "Todos os lotes devem atender às taxas de permeabilidade mínima de cada Perímetro de Qualificação Ambiental (Quadro 3A). Nos lotes com área superior a 500,00 m², fora de ZEPAM e ZPDS, a taxa pode ser reduzida em até 50% desde que atingida a pontuação de QA (art. 81, § 2º)."
        severity: attention
    basis: {source: luos, ref: "Art. 81 e Quadro 3A"}

  - code: permeabilidade-ug1
    title: "Permeabilidade mínima em terrenos com problemas geotécnicos"
    message: "Taxa de permeabilidade mínima de 20% (lote > 500,00 m²) ou 15% (lote < 500,00 m²) — art. 72."
    severity: attention
    when: {geotechnical_area: true}
    effects:
      - type: warning
        title: "Permeabilidade mínima (art. 72)"
        message: "Em terrenos localizados na UG-I ou sujeitos a recalques: 20% da área do lote para lotes com área superior a 500,00 m² e 15% para lotes com área inferior a 500,00 m², vedada a redução do art. 81, § 2º. Exige ainda a contratação de seguro de obra e riscos de engenharia e de responsabilidade civil cruzada (art. 72, § 6º, III)."
        severity: attention
    basis: {source: luos, ref: "Art. 72, I, II e § 6º"}

  - code: majoracao-gabarito-zcor
    title: "Majoração de gabarito em corredores (art. 91)"
    message: "ZCOR-2, ZCOR-3 e ZCORa: gabarito pode ser majorado em até 50% (art. 91)."
    severity: info
    applies_to_zones: [ZCOR-2, ZCOR-3, ZCORa]
    effects:
      - type: warning
        title: "Majoração de gabarito (art. 91)"
        message: "Nas ZCOR-2, ZCOR-3 e ZCORa o gabarito de altura máxima pode ser majorado em até 50%, mediante uso exclusivamente residencial, anuência expressa dos vizinhos e manifestação do órgão de preservação cultural quando houver."
        severity: info
    basis: {source: luos, ref: "Art. 91"}

  - code: recuo-fundo-maioracao-zcor
