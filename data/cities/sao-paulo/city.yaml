    name: "Zona de Uso Especial"
    group: "ZEU"
    description: "Zonas de uso especial (eixos ou Shopping Centers)."
    params:
      ca_min: {<<: *ca_min, value: 0.5, basis: {source: quadro3, ref: "Quadro 3, linha ZEU"}}
      ca_base: {<<: *ca_base, value: 1, basis: {source: quadro3, ref: "Quadro 3, linha ZEU"}}
      ca_max: {<<: *ca_max, value: 4, basis: {source: quadro3, ref: "Quadro 3, linha ZEU"}}
      to_max: {<<: *to_max, basis: {source: quadro3, ref: "Quadro 3, linha ZEU"}}
      max_height: {<<: *max_height, value: null, basis: {source: quadro3, ref: "Quadro 3, linha ZEU"}, notes: ["Não há gabarito fixo no Quadro 3 para esta zona."]}
      setback_front: {<<: *setback_front, value: null, basis: {source: quadro3, ref: "Quadro 3, linha ZEU"}, notes: ["Sem recuo frontal no Quadro 3. Em ZEU o alargamento do passeio público é obrigatório (art. 67, I)."]}
      setback_side_back: {<<: *setback_side_back, value: 3, basis: {source: quadro3, ref: "Quadro 3, linha ZEU"}, notes: ["(j) Os recuos laterais e de fundo para altura da edificação superior a 10 m serão dispensados conforme os incisos II e III do art. 66."]}
