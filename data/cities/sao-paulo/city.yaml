slug: sao-paulo
name: São Paulo
uf: SP
ibge: "3550308"
is_demo: false
description: >-
  São Paulo - Lei nº 16.402/2016 (LUOS) e Lei nº 16.050/2014 (Plano Diretor Estratégico).
  Os parâmetros de ocupação são os do Anexo 3 - Quadro 3 da lei, no texto compilado
  com as alterações das Leis nº 18.081/2024 e nº 18.177/2024.

zone_selection:
  method: manual
  hint: >-
    O zoneamento do imóvel é definido pelo mapa oficial do município
    (Lei nº 16.402/2016, Anexo 3 - Quadro 3). Consulte o mapa no GeoSampa,
    identifique a sigla da zona e selecione-a abaixo.
  helper_url: "https://geosampa.prefeitura.sp.gov.br/"

sources:
  - key: luos
    kind: lei
    number: "16.402"
    year: 2016
    title: "Lei nº 16.402/2016 — Parcelamento, uso e ocupação do solo (LUOS)"
    url: "https://legislacao.prefeitura.sp.gov.br/lei-16402-de-22-de-marco-de-2016"
    consolidated_as_of: "2024-07-25"
    retrieved_at: "2026-10-21"
    notes: >-
      Texto compilado (consolidado) com as alterações promovidas pela Lei nº 18.081/2024
      e pela Lei nº 18.177/2024. Conferir a redação vigente na data do protocolo.

  - key: quadro3
    kind: anexo
    title: "Anexo 3 da Lei nº 16.402/2016 — Quadro 3: Parâmetros de ocupação (exceto Quota Ambiental)"
    url: "https://app-plpconsulta-prd.azurewebsites.net/Forms/MostrarArquivo?TIPO=Lei&NUMERO=16402&ANO=2016&DOCUMENTO=ANEXO&Anexo=3"
    consolidated_as_of: "2024-07-25"
    retrieved_at: "2026-10-21"
    notes: >-
      Fonte dos coeficientes, taxas de ocupação, gabaritos e recuos reproduzidos neste
      cadastro. As notas de letra (a) a (o) do Quadro 3 foram convertidas em
      observações e regras condicionais.

  - key: pde
    kind: lei
    number: "16.050"
    year: 2014
    title: "Lei nº 16.050/2014 — Plano Diretor Estratégico (PDE)"
    url: "https://legislacao.prefeitura.sp.gov.br/lei-16050-de-31-de-julho-de-2014"
    retrieved_at: "2026-10-21"
    notes: >-
      Fonte de referência, citada em notas de rodape do Quadro 3 (arts. 8º, 83, 111, 112,
      275, 362 e 363 da LUOS). Não fundamenta nenhum parâmetro numérico deste cadastro.

# ---------------------------------------------------------------------------
# Modelos de parâmetro (evita repetição; podem ser sobrescritos por zona)
# ---------------------------------------------------------------------------
x-modelos:
  ca_min: &ca_min
    label: "CA mínimo"
    unit: ""
    basis: {source: quadro3, ref: "Quadro 3"}

  ca_base: &ca_base
    label: "CA básico (potencial construtivo sem outorga onerosa)"
    unit: ""
    basis: {source: quadro3, ref: "Quadro 3"}

  ca_max: &ca_max
    label: "Coeficiente de Aproveitamento máximo (CA)"
    unit: ""
    check: {type: ratio_max, numerator: total_built_area, denominator: lot_area}
    basis: {source: quadro3, ref: "Quadro 3"}

  to_max: &to_max
    label: "Taxa de Ocupação máxima (TO)"
    unit: ""
    check: {type: ratio_max, numerator: footprint_area, denominator: lot_area}
    alternatives:
      - value: 0.85
        when: {lot_area: {lt: 500}}
        basis: {source: quadro3, ref: "Quadro 3 — TO para lotes de até 500,00 m²"}
        message: "TO aplicável a lotes com área de até 500,00 m²."
      - value: 0.70
        when: {lot_area: {gte: 500}}
        basis: {source: quadro3, ref: "Quadro 3 — TO para lotes com área igual ou superior a 500,00 m²"}
        message: "TO aplicável a lotes com área igual ou superior a 500,00 m²."

  max_height: &max_height
    label: "Gabarito de altura máxima"
    unit: "m"
    check: {type: lte, field: building_height}
    basis: {source: quadro3, ref: "Quadro 3"}

  setback_front: &setback_front
    label: "Recuo frontal mínimo"
    unit: "m"
    check: {type: gte, field: proposed_setback_front}
    basis: {source: quadro3, ref: "Quadro 3"}

  setback_side_back: &setback_side_back
    label: "Recuo lateral e de fundo mínimo"
    unit: "m"
    check: {type: gte, fields: [proposed_setback_side, proposed_setback_back]}
    basis: {source: quadro3, ref: "Quadro 3"}

  cota_unidade: &cota_unidade
    label: "Cota parte máxima de terreno por unidade"
    unit: "m²"
    basis: {source: quadro3, ref: "Quadro 3"}
    notes:
      - "Verificar aplicabilidade e exceções na Lei nº 16.050/2014 (arts. 111 e 112) e no art. 73 da Lei nº 16.402/2016."

# ---------------------------------------------------------------------------
# Questionário do engenheiro
# ---------------------------------------------------------------------------
questions:
  - key: lot_area
    label: "Área do lote"
    type: number
    required: true
    unit: "m²"
    help: "Área do terreno conforme matrícula/planta cadastral (após eventual desmembramento)."

  - key: lot_front
    label: "Largura da testada (frente do lote)"
    type: number
    unit: "m"
    help: "Usada nas dispensas do art. 66, III e nos tratamentos de testada do art. 72, III."

  - key: use
    label: "Uso predominante pretendido"
    type: select
    required: true
    options: [residencial, comercial, industrial, misto, servico, institucional, ensino, saude, hotel]

  - key: floors
    label: "Número de pavimentos"
    type: number
    unit: "pav."
    help: "Com o pé-direito informado, define a altura usada no art. 66, I e no gabarito do Quadro 3."

  - key: floor_height
    label: "Pé-direito (para apurar a altura)"
    type: number
    unit: "m"
    default: 3.0

  - key: building_height
    label: "Altura da edificação"
    type: derived
    derivations:
      - fact: building_height
        op: mul
        args: [floors, floor_height]

  - key: footprint_area
    label: "Área de projeção da edificação (implantação no térreo)"
    type: number
    unit: "m²"
    help: "Base de cálculo da Taxa de Ocupação (TO)."

  - key: total_built_area
    label: "Área construída computável total"
    type: number
    unit: "m²"
    help: "Base de cálculo do CA. Descontar as áreas não computáveis do art. 62."

  - key: units
    label: "Número de unidades residenciais / empreendimentos"
    type: number

  - key: proposed_setback_front
    label: "Recuo frontal adotado no projeto"
    type: number
    unit: "m"

  - key: proposed_setback_side
    label: "Recuo lateral adotado no projeto"
    type: number
    unit: "m"

  - key: proposed_setback_back
    label: "Recuo de fundo adotado no projeto"
    type: number
    unit: "m"

  - key: sidewalk_width
    label: "Largura atual do passeio público"
    type: number
    unit: "m"
    help: "Abaixo de 5,00 m há exigência de alargamento em diversas zonas (art. 67)."

  - key: block_face_occupied_pct
    label: "Percentual da face de quadra ocupado por edificações no alinhamento"
    type: number
    unit: "%"
    help: "A partir de 50% o recuo frontal deixa de ser exigido (art. 69)."

  - key: neighbor_attached
    label: "Há edificação vizinha encostada na divisa do lote?"
    type: boolean
    help: "A dispensa do recuo lateral/de fundo depende de análise caso a caso do órgão (art. 66, II)."

  - key: uses_art91
    label: "Utiliza majoração de gabarito do art. 91?"
    type: boolean
    help: "ZCOR-2, ZCOR-3 e ZCORa: majoração de até 50% do gabarito, com anuência dos vizinhos."

  - key: geotechnical_area
    label: "O terreno está em UG-I ou apresenta recalques/problemas geotécnicos?"
    type: boolean
    help: "Dispara as exigências adicionais do art. 72 (permeabilidade mínima de 20%/15% e seguros)."

# ---------------------------------------------------------------------------
# Zonas (Anexo 3 — Quadro 3 da Lei nº 16.402/2016)
# ---------------------------------------------------------------------------
zones:
