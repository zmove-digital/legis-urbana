    severity: info
    applies_to_zones: [ZEU, ZEUa, ZEUP, ZEUPa, ZEM, ZEMP]
    effects:
      - type: warning
        title: "Áreas não computáveis"
        message: "Nas ZEU, ZEUa, ZEUP, ZEUPa, ZEM e ZEMP, são áreas não computáveis as áreas cobertas ocupadas por circulação, manobra e estacionamento de veículos, desde que observada a cota de garagem máxima de 32,00 m² por vaga e o número de vagas previsto no art. 62."
