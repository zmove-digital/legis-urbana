    when: {use: {in: [ensino, saude, hotel]}}
    effects:
      - type: warning
        title: "CA majorado (art. 62, parágrafo único)"
        message: "Para novas construções e reformas com ampliação de área construída de estabelecimentos de ensino, saúde e pesquisa em saúde e de hotéis localizados em ZEU, ZEUa, ZEUP, ZEUPa ou ZC, o CA máximo é majorado em 50%. Confirmar a redação vigente do art. 62 e os limites da outorga onerosa."
