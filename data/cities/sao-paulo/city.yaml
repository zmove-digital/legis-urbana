    severity: info
    applies_to_zones: [ZEUP, ZEUPa]
    effects:
      - type: warning
        title: "Recepção de parâmetros (notas (b) e (c) do Quadro 3)"
        message: "Atendidos os requisitos do art. 83 da Lei nº 16.050/2014 (PDE), a zona ZEUP recepciona automaticamente os parâmetros da zona ZEU e a ZEUPa os da ZEUa."
        severity: info
    basis: {source: quadro3, ref: "Notas (b) e (c) do Quadro 3"}

  - code: area-mananciais
    title: "Zonas em área de proteção e recuperação aos mananciais"
    message: "Aplicar a legislação estadual pertinente, quando mais restritiva (nota (a) do Quadro 3)."
    severity: info
    effects:
      - type: warning
        title: "Legislação estadual de mananciais"
        message: "Nas zonas inseridas na área de proteção e recuperação aos mananciais aplica-se a legislação estadual pertinente, quando mais restritiva (art. 5º, § 2º da Lei nº 16.402/2016)."
        severity: info
    basis: {source: quadro3, ref: "Nota (a) do Quadro 3 e art. 5º, § 2º"}

  - code: incremento-ca-educacao-saude-hotel
    title: "Majoração do CA para ensino, saúde e hotelaria"
